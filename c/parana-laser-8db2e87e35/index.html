<style>*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:#FFFEFF;font-family:'Montserrat',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
background:repeating-linear-gradient(90deg,rgba(255,254,255,.035) 0 1px,transparent 1px 120px),radial-gradient(ellipse at 75% 25%,rgba(78,12,204,.55),transparent 55%),radial-gradient(ellipse at 10% 100%,rgba(0,140,187,.35),transparent 50%),linear-gradient(180deg,#0B0B10,#100A22 70%,#0B0B10)}
.b{width:min(400px,100%);padding:34px 32px;border-radius:18px;background:rgba(255,254,255,.05);border:1px solid rgba(255,254,255,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.b img{height:20px;display:block}
.ey{display:flex;align-items:center;gap:10px;font-family:'Geist Mono',monospace;font-size:.72rem;text-transform:uppercase;color:rgba(255,254,255,.7);margin-top:34px}
.ey::before{content:"";width:28px;height:1.5px;background:#4FC3E8}
h1{font-family:'Geist',sans-serif;font-weight:700;font-size:1.7rem;line-height:1.1;letter-spacing:-.02em;margin:12px 0 24px}
input[type=password]{width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid rgba(255,254,255,.18);background:rgba(11,11,16,.55);color:#FFFEFF;font:500 16px 'Montserrat',sans-serif;outline:none;transition:border-color .2s}
input[type=password]:focus{border-color:#4FC3E8}
label{font-size:.82rem;color:rgba(255,254,255,.7);display:flex;gap:8px;align-items:center;margin-top:14px;cursor:pointer}
label input{accent-color:#4E0CCC;width:15px;height:15px}
button{margin-top:22px;width:100%;display:flex;align-items:center;justify-content:space-between;padding:7px 7px 7px 22px;border:0;border-radius:999px;background:#4E0CCC;color:#FFFEFF;font:700 .92rem 'Geist',sans-serif;cursor:pointer;transition:background .2s}
button:hover{background:#371082}
button i{width:34px;height:34px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;transition:transform .25s}
button:hover i{transform:rotate(-45deg)}
.e{color:#FF8A9A;font-size:.84rem;min-height:20px;margin-top:12px}</style></head>
